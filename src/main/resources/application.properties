# ==== サーバー設定 ====
server.port=8080

# ==== DB設定 (SQLite) ====
# review.db というファイルがプロジェクト直下に作られる
spring.datasource.url=jdbc:sqlite:review.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLiteは同時書き込みに弱いのでコネクションは1本に固定
spring.datasource.hikari.maximum-pool-size=1

# 起動のたびに schema.sql を実行してテーブルがなければ作る
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ==== Claude API設定 ====
# 環境変数 ANTHROPIC_API_KEY を読み込む(コード上に直接キーは書かない)
claude.api.key=${ANTHROPIC_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages
# 使うモデル。必要に応じて変更可
claude.api.model=claude-sonnet-4-5-20250929
claude.api.max-tokens=1500

logging.level.com.mahiro.reviewbot=INFO
