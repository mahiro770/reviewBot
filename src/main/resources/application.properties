# ==== サーバー設定 ====
server.port=8080

# ==== DB設定 (SQLite) ====
# review.db というファイルがプロジェクト直下に作られる
spring.datasource.url=jdbc:sqlite:review.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLiteは同時書き込みに弱いのでコネクションは1本に固定
spring.datasource.hikari.maximum-pool-size=1

# テーブル作成/変更は自前の簡易マイグレーション(SchemaMigrator)が
# db/migration/V*.sql を起動時に番号順・1回ずつ適用する形で管理している
# (Spring標準のspring.sql.init機構は使っていない)

# ==== Gemini API設定 ====
# 環境変数 GEMINI_API_KEY を読み込む(コード上に直接キーは書かない)
# APIキーは https://aistudio.google.com/apikey で無料発行できる
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
# 使うモデル。無料枠で使えるモデル。必要に応じて変更可
gemini.api.model=gemini-3.6-flash
# このモデルは応答前に内部で「思考」トークンを消費する(1000トークン超えることもある)ため、
# 出力用に余裕を持たせている。小さくしすぎると構造化出力が思考分で埋まり、
# reviewフィールドなどが "..." のように切り詰められてしまう。
gemini.api.max-tokens=8192

logging.level.com.mahiro.reviewbot=INFO
